<!doctype html><meta charset="utf-8"><body><pre id="out">PENDING</pre><iframe id="f" style="width:1200px;height:900px;border:0"></iframe>
<script>(async()=>{const f=document.getElementById('f');f.src='/index.html';await new Promise(r=>f.onload=r);await new Promise(r=>setTimeout(r,5000));const d=f.contentDocument;const svgs=[...d.querySelectorAll('figure svg')].filter(s=>!s.closest('button')&&s.getBoundingClientRect().width>100);
const out=svgs.map((s,i)=>{const fig=s.closest('figure');return{i,id:s.id,smil:s.querySelectorAll('animate,animateTransform,animateMotion,set').length,btn:!!(fig&&fig.querySelector('button[aria-label]')),canvas:!!(fig&&fig.querySelector('canvas'))}}).filter(x=>x.smil||x.btn||x.id);
document.getElementById('out').textContent=JSON.stringify(out);})();</script>
