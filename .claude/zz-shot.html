<!doctype html><meta charset="utf-8"><body style="margin:0;overflow:hidden"><iframe id="f" style="width:1200px;height:900px;border:0"></iframe>
<script>const q=new URLSearchParams(location.search);(async()=>{const f=document.getElementById('f');f.src='/'+q.get('page');await new Promise(r=>f.onload=r);await new Promise(r=>setTimeout(r,4000));const d=f.contentDocument;const svgs=[...d.querySelectorAll('figure svg')].filter(s=>!s.closest('button')&&s.getBoundingClientRect().width>100);svgs[+q.get('fig')].scrollIntoView({block:'center'});})();</script>
